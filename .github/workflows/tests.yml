name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: P${{ matrix.php }} / L${{ matrix.laravel }} / ${{ matrix.stability }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          - os: windows-latest
            php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            stability: prefer-stable
        exclude:
          - php: '8.2'
            laravel: '13.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, json, fileinfo, tokenizer
          coverage: ${{ (matrix.os == 'ubuntu-latest' && matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable') && 'pcov' || 'none' }}

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable') }}
        run: vendor/bin/pest --ci

      - name: Run tests with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' }}
        run: vendor/bin/pest --ci --coverage --min=90
